[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glancepath"
version = "0.0.1"
description = "Visual answers for the questions developers already have about code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Adithya" }
]
dependencies = []

[project.scripts]
glancepath = "glancepath.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/glancepath"]
